<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiMo 思维链代理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
header h1 .badge{background:#238636;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
header .info{font-size:13px;color:#8b949e}
.container{max-width:1200px;margin:0 auto;padding:20px 24px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px 16px}
.card .label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.card .value{font-size:26px;font-weight:700;margin-top:6px;color:#f0f6fc}
.card .value.green{color:#3fb950}
.card .value.red{color:#f85149}
.card .value.orange{color:#d29922}
.card .value.blue{color:#58a6ff}

.section-title{font-size:15px;font-weight:600;margin:20px 0 10px;padding-bottom:8px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:8px}
.section-title small{font-weight:400;font-size:12px;color:#8b949e}

table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #21262d}
th{color:#8b949e;font-weight:500;font-size:12px;width:160px}
td{color:#e1e4e8}
tr:hover td{background:#1c2128}

.actions{display:flex;gap:10px;align-items:center;margin:16px 0}
.btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.btn:hover{background:#30363d;border-color:#8b949e}
.btn.danger{border-color:#f85149;color:#f85149}
.btn.danger:hover{background:#f85149;color:#fff}
.btn.primary{background:#238636;border-color:#238636;color:#fff}
.btn.primary:hover{background:#2ea043}
.actions small{color:#8b949e;font-size:12px}

.log-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;max-height:360px;overflow-y:auto;font-family:'Cascadia Code','Fira Code','JetBrains Mono',monospace;font-size:12px;line-height:1.8}
.log-box::-webkit-scrollbar{width:6px}
.log-box::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.log-box::-webkit-scrollbar-track{background:transparent}
.log-entry{padding:3px 14px;border-bottom:1px solid #1c2128;white-space:pre-wrap;word-break:break-all}
.log-entry:last-child{border-bottom:none}
.log-entry .time{color:#484f58;margin-right:8px}
.log-entry .level{display:inline-block;width:52px;font-weight:600}
.log-entry .info{color:#58a6ff}
.log-entry .warning{color:#d29922}
.log-entry .error{color:#f85149}
.log-entry .success{color:#3fb950}
.log-entry .system{color:#8b949e}

@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}header{flex-direction:column;align-items:flex-start}}

.up-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:8px;margin-bottom:8px;transition:.15s}
.up-item.active{border-color:#238636;background:#1a2a1a}
.up-item .up-status{width:8px;height:8px;border-radius:50%;background:#484f58;flex-shrink:0}
.up-item.active .up-status{background:#3fb950}
.up-item .up-info{flex:1;min-width:0}
.up-item .up-name{font-weight:600;font-size:14px;color:#f0f6fc}
.up-item .up-url{font-size:12px;color:#8b949e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-item .up-actions{display:flex;gap:6px;flex-shrink:0}
.up-item .up-actions .btn{padding:4px 12px;font-size:12px}
.up-add{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.inp{background:#0d1117;border:1px solid #30363d;color:#e1e4e8;padding:7px 12px;border-radius:6px;font-size:13px;outline:none;transition:.15s}
.inp:focus{border-color:#58a6ff}
.inp-wide{flex:1;min-width:200px}
.inp-label{font-size:12px;color:#8b949e;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    MiMo 思维链代理
    <span class="badge">v2.0</span>
  </h1>
  <div class="info" id="headerInfo">加载中...</div>
</header>
<div class="container">
  <div class="cards" id="cards"></div>

  <div class="section-title">配置信息</div>
  <table id="cfg"></table>

  <div class="section-title">
    缓存设置
    <small>修改即时生效</small>
  </div>
  <div id="cacheSettings" class="up-add" style="margin-bottom:16px">
    <label class="inp-label">内存上限</label>
    <input type="number" id="csHotMax" class="inp" style="width:90px" min="100">
    <span id="coldWrap">
      <label class="inp-label">DB 上限</label>
      <input type="number" id="csColdMax" class="inp" style="width:90px" min="100">
    </span>
    <label class="inp-label">TTL（秒）</label>
    <input type="number" id="csTtl" class="inp" style="width:100px" min="60">
    <button class="btn primary" onclick="saveCacheConfig()">应用</button>
    <span id="csMsg" style="font-size:12px;color:#3fb950;display:none">已更新</span>
  </div>

  <div class="section-title">
    上游管理
    <small>点击切换活跃上游</small>
  </div>
  <div id="upstreamList" style="margin-bottom:16px"></div>
  <div class="up-add" id="upAddForm">
    <input type="text" id="upName" placeholder="名称" class="inp">
    <input type="text" id="upUrl" placeholder="https://api.example.com/v1" class="inp inp-wide">
    <input type="text" id="upModel" placeholder="模型名（空=任意）" class="inp">
    <button class="btn primary" onclick="addUpstream()">添加</button>
  </div>

  <div class="actions">
    <button class="btn primary" onclick="clearCache()">清空缓存</button>
    <button class="btn" onclick="refresh()">刷新</button>
    <small>自动刷新（每 5 秒）</small>
  </div>

  <div class="section-title">
    运行日志
    <small id="lcnt"></small>
  </div>
  <div class="log-box" id="logs"></div>
</div>

<script>
function $(id){return document.getElementById(id)}
async function fetchJSON(u,o){try{const r=await fetch(u,o);return await r.json()}catch{return null}}

function levelClass(level){
  switch(level){
    case 'INFO': return 'info'
    case 'WARNING': return 'warning'
    case 'ERROR': return 'error'
    case 'SUCCESS': return 'success'
    default: return 'system'
  }
}

async function refresh(){
  const d=await fetchJSON('/api/stats')
  if(!d) return
  const s=d.stats,c=d.cache

  $('headerInfo').textContent = '运行中 · 上游: ' + d.upstream

  const cards = [
    ['总请求', s.requests, ''],
    ['成功', s.success, 'green'],
    ['失败', s.failed, s.failed > 0 ? 'red' : ''],
    ['流式', s.stream, 'blue'],
    ['缓存命中', s.cache_hits+' ('+s.hit_rate+')', 'green'],
    ['降级', s.degraded, s.degraded > 0 ? 'orange' : ''],
    ['重试', s.retries, s.retries > 0 ? 'orange' : ''],
    ['缓存大小', c.size+'/'+ (c.hot ? c.hot.max : c.max), c.size/(c.hot?c.hot.max:c.max) > 0.8 ? 'orange' : ''],
    ['运行时长', s.uptime, '']
  ]
  $('cards').innerHTML = cards.map(([label,val,cls]) =>
    `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${val}</div></div>`
  ).join('')

  $('cfg').innerHTML = [
    ['上游地址', d.upstream],
    ['监听地址', '{{HOST}}:{{PORT}}'],
    ['缓存后端', c.backend],
    ['过期时间', (c.hot ? c.hot.ttl : c.ttl) + ' 秒'],
    ['工具索引', (c.hot ? c.hot.tc_index : c.tc_index) + ' 条']
  ].map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')

  const ld=await fetchJSON('/api/logs?count=80')
  if(!ld) return
  const el=$('logs')
  const atBot = el.scrollTop + el.clientHeight >= el.scrollHeight - 20
  el.innerHTML = ld.logs.map(l =>
    `<div class="log-entry"><span class="time">${l.time}</span><span class="level ${levelClass(l.level)}">[${l.level}]</span>${l.msg}</div>`
  ).join('')
  $('lcnt').textContent = '共 ' + ld.logs.length + ' 条'
  if(atBot) el.scrollTop = el.scrollHeight
}

async function clearCache(){
  await fetchJSON('/api/cache/clear', {method:'POST'})
  refresh()
}

async function refreshUpstreams(){
  const d=await fetchJSON('/api/upstreams')
  if(!d) return
  const el=$('upstreamList')
  el.innerHTML = d.upstreams.map(u => {
    const cls = u.is_active ? 'up-item active' : 'up-item'
    const btns = u.is_active
      ? '<span style="color:#3fb950;font-size:12px;font-weight:600">当前</span>'
      : `<button class="btn" onclick="switchUpstream(${u.id})">切换</button>
         <button class="btn danger" onclick="deleteUpstream(${u.id})">删除</button>`
    return `<div class="${cls}">
      <div class="up-status"></div>
      <div class="up-info">
        <div class="up-name">${u.name} ${u.model ? '· <span style="color:#58a6ff">'+u.model+'</span>' : '(任意)'}</div>
        <div class="up-url">${u.url}</div>
      </div>
      <div class="up-actions">${btns}</div>
    </div>`
  }).join('') || '<div style="color:#8b949e;font-size:13px;padding:8px">暂无上游</div>'
}

async function switchUpstream(id){
  await fetchJSON('/api/upstreams/active', {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id})
  })
  refresh()
  refreshUpstreams()
}

async function deleteUpstream(id){
  await fetchJSON('/api/upstreams/'+id, {method:'DELETE'})
  refreshUpstreams()
}

async function addUpstream(){
  const name=$('upName').value.trim()
  const url=$('upUrl').value.trim()
  const model=$('upModel').value.trim()
  if(!url) return
  await fetchJSON('/api/upstreams', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,url,model})
  })
  $('upName').value=''
  $('upUrl').value=''
  $('upModel').value=''
  refreshUpstreams()
}

let _cacheCfg=null
async function loadCacheConfig(){
  _cacheCfg=await fetchJSON('/api/cache/config')
  if(!_cacheCfg) return
  if(_cacheCfg.backend==='tiered'){
    $('csHotMax').value=_cacheCfg.hot.max
    $('csColdMax').value=_cacheCfg.cold.max
    $('csTtl').value=_cacheCfg.hot.ttl
    $('coldWrap').style.display=''
  } else {
    $('csHotMax').value=_cacheCfg.max
    $('csTtl').value=_cacheCfg.ttl
    $('coldWrap').style.display='none'
  }
}

async function saveCacheConfig(){
  const body={
    hot_max_size: parseInt($('csHotMax').value)||2000,
    ttl: parseInt($('csTtl').value)||7200,
  }
  if(_cacheCfg&&_cacheCfg.backend==='tiered'){
    body.cold_max_size=parseInt($('csColdMax').value)||10000
  }
  await fetchJSON('/api/cache/config',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  })
  const msg=$('csMsg')
  msg.style.display='inline'
  setTimeout(()=>msg.style.display='none',2000)
  loadCacheConfig()
}

refresh()
refreshUpstreams()
loadCacheConfig()
setInterval(refresh, 5000)
setInterval(refreshUpstreams, 10000)
</script>
</body>
</html>
